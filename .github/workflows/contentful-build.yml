name: Build Blog from Contentful

on:
  repository_dispatch:
    types: [contentful-publish]
  workflow_dispatch:
  schedule:
    # Safety net: the Contentful webhook is the primary trigger, but if it
    # ever fails silently (expired token, misconfigured URL, etc.) this
    # catches up any published posts within 24h instead of leaving the
    # blog stale indefinitely. See git history around 2026-09-01 for why.
    - cron: '0 13 * * *' # 10:00 America/Argentina/Buenos_Aires (UTC-3)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: rm -rf node_modules && npm install

      - name: Clean generated blog files
        run: find blog/ -name "*.html" -delete

      - name: Build blog from Contentful
        env:
          SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
        run: node scripts/build-blog.js

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: regenerate blog from Contentful"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
